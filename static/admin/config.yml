# =============================================================================
# Mr. Chile Taproom — CMS
#
# Edits here commit to GitHub, which rebuilds and publishes the site. The build
# guards still apply: a missing image or an unresolved label fails the build and
# Vercel keeps the last good version live, so a bad edit cannot take the site
# down — it just does not publish.
#
# Bilingual fields are English and Spanish side by side and both are required,
# because a half-translated site is worse than an untranslated one.
# =============================================================================

backend:
  name: github
  repo: siamakk2/Mr-Chile-Taprom
  branch: main
  base_url: https://www.mrchiletaproom.com
  auth_endpoint: api/auth/

publish_mode: simple
media_folder: static/img
public_folder: /img
locale: en

collections:
  # ---------------------------------------------------------------- hours ---
  - name: hours
    label: Hours
    files:
      - name: hours
        label: Opening hours
        file: content/hours.json
        description: Changing these updates the hours table, the open/closed indicator, and what Google shows in search.
        fields:
          - name: hours
            label: Week
            widget: list
            allow_add: false
            collapsed: false
            summary: '{{fields.day.en}} — {{fields.label}}'
            fields:
              - { name: day, label: Day, widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: schemaDay, label: Day code (do not change), widget: string }
              - { name: open, label: Opens (24h, e.g. 15:00), widget: string, required: false }
              - { name: close, label: Closes (24h, e.g. 21:00), widget: string, required: false }
              - { name: label, label: Shown on the site (e.g. 3pm – 9pm), widget: string }
          - name: happyHour
            label: Hoppy Hour
            widget: object
            fields:
              - { name: name, label: Name, widget: string }
              - { name: days, label: Days shown, widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: schemaDays, label: Day codes, widget: list, field: { name: day, widget: string } }
              - { name: opens, label: Starts (24h), widget: string }
              - { name: closes, label: Ends (24h), widget: string }
              - { name: window, label: Window shown, widget: string }
              - { name: deals, label: Deals, widget: object, fields: [
                  { name: en, label: English, widget: text },
                  { name: es, label: Español, widget: text } ] }

  # ----------------------------------------------------------------- menu ---
  - name: menu
    label: Menu
    files:
      - name: menu
        label: Food & drink
        file: content/menu.json
        fields:
          - name: pricesConfirmed
            label: Show prices on the site
            widget: boolean
            hint: Turn this off to hide every price at once if they go out of date.
          - name: menu
            label: Sections
            widget: list
            collapsed: true
            summary: '{{fields.section.en}}'
            fields:
              - { name: section, label: Section name, widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: note, label: Section note, widget: object, fields: [
                  { name: en, label: English, widget: text },
                  { name: es, label: Español, widget: text } ] }
              - name: items
                label: Items
                widget: list
                summary: '{{fields.name.en}}{{fields.name}} — ${{fields.price}}'
                fields:
                  - { name: name, label: Name, widget: object, fields: [
                      { name: en, label: English, widget: string },
                      { name: es, label: Español, widget: string } ] }
                  - { name: price, label: Price (numbers only, e.g. 14.50), widget: string, required: false }
                  - { name: desc, label: Description, widget: object, fields: [
                      { name: en, label: English, widget: text },
                      { name: es, label: Español, widget: text } ] }

  # --------------------------------------------------------------- events ---
  - name: events
    label: Events
    files:
      - name: events
        label: Event nights
        file: content/events.json
        description: Recurring nights and one-off dates. Cumbia Rosa dates calculate themselves — only add here if a date is unusual.
        fields:
          - name: series
            label: Recurring nights
            widget: list
            collapsed: true
            summary: '{{fields.name}}'
            fields:
              - { name: slug, label: URL name (do not change), widget: string }
              - { name: pageKey, label: Own page key, widget: string, required: false }
              - { name: name, label: Name, widget: string }
              - { name: kicker, label: When (short), widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: short, label: One line, widget: object, fields: [
                  { name: en, label: English, widget: text },
                  { name: es, label: Español, widget: text } ] }
              - { name: long, label: Full description, widget: object, fields: [
                  { name: en, label: English, widget: text },
                  { name: es, label: Español, widget: text } ] }
              - { name: startTime, label: Starts (24h), widget: string }
              - { name: endTime, label: Ends (24h), widget: string }
              - { name: age, label: Age policy, widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: image, label: Flyer, widget: image, required: false }
              - { name: byDay, label: Day of week code, widget: string, required: false }
              - { name: byMonthWeek, label: Week of month code, widget: string, required: false }
              - { name: genre, label: Genre, widget: string, required: false }
              - name: partner
                label: Presented by
                widget: object
                required: false
                fields:
                  - { name: name, label: Name, widget: string, required: false }
                  - { name: url, label: Website, widget: string, required: false }
          - name: datedEvents
            label: Specific dates
            widget: list
            collapsed: true
            summary: '{{fields.date}} — {{fields.name}}'
            fields:
              - { name: date, label: Date (YYYY-MM-DD), widget: string }
              - { name: name, label: Name, widget: string }
              - { name: seriesSlug, label: Part of which night, widget: string, required: false }
              - { name: start, label: Starts (24h), widget: string }
              - { name: end, label: Ends (24h), widget: string }
              - { name: lineup, label: Line-up, widget: string, required: false }
              - { name: food, label: Food note, widget: string, required: false }
              - { name: price, label: Price, widget: string, required: false }
              - { name: priceNote, label: Price note, widget: object, required: false, fields: [
                  { name: en, label: English, widget: string, required: false },
                  { name: es, label: Español, widget: string, required: false } ] }
              - { name: ticketUrl, label: Ticket link, widget: string, required: false }
              - { name: image, label: Flyer, widget: image, required: false }

  # ------------------------------------------------------- private events ---
  - name: private
    label: Private events
    files:
      - name: private
        label: Packages
        file: content/private-events.json
        fields:
          - name: privatePackages
            label: Packages
            widget: list
            collapsed: true
            summary: '{{fields.name.en}}'
            fields:
              - { name: name, label: Name, widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: capacity, label: Capacity, widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: slug, label: URL name (do not change), widget: string }
              - { name: best, label: Best for, widget: object, fields: [
                  { name: en, label: English, widget: text },
                  { name: es, label: Español, widget: text } ] }
              - { name: includes, label: What's included, widget: object, fields: [
                  { name: en, label: English, widget: text },
                  { name: es, label: Español, widget: text } ] }

  # ------------------------------------------------------------------ faq ---
  - name: faq
    label: FAQ
    files:
      - name: faq
        label: Questions
        file: content/faq.json
        description: These also feed the answers Google and AI assistants give about the taproom, so answer the question fully in the first sentence.
        fields:
          - name: faqs
            label: Questions
            widget: list
            collapsed: true
            summary: '{{fields.q.en}}'
            fields:
              - { name: q, label: Question, widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: a, label: Answer, widget: object, fields: [
                  { name: en, label: English, widget: text },
                  { name: es, label: Español, widget: text } ] }

  # ------------------------------------------------------------- business ---
  - name: business
    label: Contact & details
    files:
      - name: business
        label: Business details
        file: content/business.json
        description: Address and phone appear in dozens of places including Google's listing. Change with care.
        fields:
          - { name: name, label: Business name, widget: string }
          - { name: altName, label: Also known as, widget: string }
          - { name: tagline, label: Tagline, widget: object, fields: [
              { name: en, label: English, widget: string },
              { name: es, label: Español, widget: string } ] }
          - { name: phone, label: Phone (display), widget: string }
          - { name: phoneE164, label: Phone (dialling, +1…), widget: string }
          - { name: email, label: Email, widget: string }
          - { name: street, label: Street, widget: string }
          - { name: locality, label: City, widget: string }
          - { name: region, label: State, widget: string }
          - { name: postal, label: ZIP, widget: string }
          - { name: country, label: Country code, widget: string }
          - { name: crossStreet, label: Cross street, widget: object, fields: [
              { name: en, label: English, widget: string },
              { name: es, label: Español, widget: string } ] }
          - { name: county, label: County, widget: string }
          - { name: priceRange, label: Price range, widget: string }
          - name: profiles
            label: Social links
            widget: object
            fields:
              - { name: instagram, label: Instagram, widget: string, required: false }
              - { name: facebook, label: Facebook, widget: string, required: false }
              - { name: yelp, label: Yelp, widget: string, required: false }

  # ---------------------------------------------------------------- extras ---
  - name: amenities
    label: Amenities
    files:
      - name: amenities
        label: What's here
        file: content/amenities.json
        fields:
          - name: amenities
            label: Amenities
            widget: list
            collapsed: true
            summary: '{{fields.name.en}}'
            fields:
              - { name: name, label: Name, widget: object, fields: [
                  { name: en, label: English, widget: string },
                  { name: es, label: Español, widget: string } ] }
              - { name: detail, label: Detail, widget: object, fields: [
                  { name: en, label: English, widget: text },
                  { name: es, label: Español, widget: text } ] }
